[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ig-bulk-downloader"
version = "2026.1.0"
description = "Bulk-download Instagram media (posts, reels, stories, highlights) in original quality"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "emblemengineerscoop" }]
keywords = ["instagram", "downloader", "bulk", "reels", "stories", "media"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia",
]
dependencies = [
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "aiofiles>=23.2.1",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.3",
    "pydantic>=2.5.0",
    "rich>=13.7.0",
    "click>=8.1.7",
]

[project.scripts]
ig-downloader = "ig_downloader.__main__:main"

[project.urls]
Homepage = "https://github.com/emblemengineerscoop/instagram-bulk-downloader-2026"
Issues   = "https://github.com/emblemengineerscoop/instagram-bulk-downloader-2026/issues"
